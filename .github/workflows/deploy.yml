name: Deploy to Coolify

# A stale COOLIFY_TOKEN silently "succeeded" here for hours: Coolify answers an
# unauthorized call with HTTP 200 and a body of
#   {"success":true,"message":"You are not allowed to access the API."}
# so plain curl exits 0 and the job goes green without deploying anything. The
# step below therefore asserts that a deployment was actually queued, and the
# diagnostics step prints only non-sensitive fingerprints of the credentials.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check credentials are present
        run: |
          if [ -z "$COOLIFY_BASE_URL" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::COOLIFY_BASE_URL and COOLIFY_TOKEN secrets must both be set"
            exit 1
          fi
          echo "base url: $COOLIFY_BASE_URL"
          echo "token: id=${COOLIFY_TOKEN%%|*} sha256=$(printf '%s' "$COOLIFY_TOKEN" | sha256sum | cut -c1-12)"
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}

      - name: Trigger Coolify deploy
        run: |
          uuid=vwtqdqezxw3lpmpzq76drgb1
          body=$(curl -sS --max-time 60 -X POST \
            "$COOLIFY_BASE_URL/deploy?uuid=$uuid&force=true" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"uuid\":\"$uuid\"}")
          echo "response: $body"
          if ! printf '%s' "$body" | grep -q deployment_uuid; then
            echo "::error::Coolify did not queue a deployment — check that COOLIFY_BASE_URL points at this instance and COOLIFY_TOKEN is a valid, write-scoped token for it"
            exit 1
          fi
          echo "deployment queued"
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
