name: validate

# Second net behind scripts/git-hooks/pre-push: re-runs types, the full
# offline test suite, and the live-execution change gate on every push
# to main (every push auto-deploys the VPS executor). Protect `main`
# and mark this check required to turn it into a pre-merge hard gate.
# Policy: web/EXEC_CHANGE_POLICY.md

on:
  push:
    branches: [main]
  # Run the same checks on PRs into main — the only way to get them
  # BEFORE a deploy (every push to main auto-deploys the executor).
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # matches the local dev Node — the test runner's directory import
          # (node --test tests/) needs Node >= 24 (fails on 22)
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        working-directory: web
        run: npm ci
      - name: typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: tests
        working-directory: web
        # The golden suites below read the local gcdata/data session fixture
        # (gitignored) directly or via lib/gcdata analyze/extractFootprint —
        # they are dev-machine-only. Local `npm test` keeps the full
        # 530-test coverage; CI runs the offline unit suite without them.
        run: |
          node --import ./tests/ts-loader.mjs --test \
            $(find tests -maxdepth 1 -name '*.test.ts') \
            $(find tests -maxdepth 1 -name '*.test.mjs' | grep -vE '/(analysis|api|db|imbalance|mechanism|ohlc|priceaction|profiles|signalEngine|story)\.test\.mjs$')
      - name: live-execution change gate
        env:
          # push: the previous tip of main · PR: the PR's base commit
          # (github.event.before is empty on pull_request events, which
          # made the gate diff nothing and pass silently)
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/exec-gate.sh "$BEFORE" "$GITHUB_SHA"
      - name: post-deploy smoke (polls for the Coolify deploy)
        # only a push to main deploys — PRs and manual runs have nothing to smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: web
        # read-only health assertions: the deployed buildId must match, the
        # feed must be live, and tapeGate.veto must be clear (the 2026-10-15
        # clock-mix signature). --allow-stale-candles tolerates halt hours.
        # The loader lives at the REPO ROOT (scripts/ts-loader.mjs) — the
        # web-local ./scripts path never resolved and failed every run.
        run: node --import ../scripts/ts-loader.mjs scripts/live-smoke.ts --expect-build "$GITHUB_SHA" --allow-stale-candles
